<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1920px;height:1920px;overflow:hidden;font-family:Inter,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;background:
  radial-gradient(1300px 1100px at 20% 15%, rgba(120,205,255,.9), rgba(120,205,255,0) 65%),
  radial-gradient(1200px 1200px at 85% 90%, rgba(128,108,245,.95), rgba(128,108,245,0) 65%),
  linear-gradient(135deg,#58b6f8 0%,#6f9cf5 45%,#7c78f1 100%)}
.grain{position:absolute;inset:0;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.wrap{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.icon{position:relative;width:840px;height:495px;margin-bottom:60px}
h1{margin:0;font-size:150px;font-weight:700;letter-spacing:-.025em;line-height:1}
p{margin:34px 0 0;font-size:62px;font-weight:600;letter-spacing:-.01em;opacity:.97}
</style></head>
<body>
<div class="bg"></div><div class="grain"></div>
<div class="wrap" id="wrap">
  <div class="icon" id="icon">
    <svg width="840" height="495" viewBox="0 0 560 330" style="overflow:visible">
      <defs>
        <radialGradient id="sun" cx="40%" cy="40%"><stop offset="0" stop-color="#fff6c9"/><stop offset=".55" stop-color="#ffd25c"/><stop offset="1" stop-color="#ffb62e"/></radialGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#fff3b0" stop-opacity=".7"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/></radialGradient>
        <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dfe9f7"/></linearGradient>
        <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2a2f8a" flood-opacity=".22"/></filter>
      </defs>
      <g id="sunG"><circle cx="440" cy="70" r="150" fill="url(#glow)"/><circle cx="440" cy="70" r="62" fill="url(#sun)"/></g>
      <!-- back bubble -->
      <g filter="url(#sh)" opacity=".75"><rect x="110" y="128" width="380" height="118" rx="30" fill="#e8ebf3"/></g>
      <!-- front bubble -->
      <g filter="url(#sh)" id="bub">
        <rect x="70" y="96" width="380" height="118" rx="30" fill="#fff"/>
        <path d="M70 184 v40 l-26 14 c 22 2 44 -6 56 -24 z" fill="#fff"/>
        <rect x="88" y="124" width="10" height="64" rx="5" fill="#3d8af5"/>
        <rect x="118" y="128" width="170" height="24" rx="12" fill="#3d8af5"/>
        <rect x="118" y="164" width="290" height="22" rx="11" fill="#d3d6dd"/>
      </g>
      <!-- snow cap on the bubble -->
      <g id="cap" style="transform-origin:260px 100px">
        <path d="M74 110 C 80 80, 108 78, 128 76 C 152 64, 172 82, 198 72 C 224 62, 248 80, 274 70 C 302 60, 328 80, 354 70 C 380 60, 406 80, 426 72 C 446 68, 456 88, 450 110 C 300 104, 200 104, 74 110 Z"
              fill="url(#snow)" stroke="#a8bedc" stroke-width="1.5" filter="url(#sh)"/>
      </g>
      <g id="flakes" fill="#fff"></g>
    </svg>
  </div>
  <h1 id="title">Live Weather</h1>
  <p id="sub">The chat wallpaper follows the real weather</p>
</div>
<script>
const $ = (s) => document.getElementById(s);
const flakes = Array.from({ length: 16 }, (_, i) => ({ x: 40 + ((i * 97) % 500), y0: -40 - ((i * 53) % 260), r: 4 + (i % 3) * 2.2, sp: 70 + (i * 13) % 50, ph: i * 1.7 }));
$('flakes').innerHTML = flakes.map((f, i) => `<circle id="f${i}" r="${f.r}" opacity=".95"/>`).join('');
const clamp = (v) => Math.max(0, Math.min(1, v));
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const back = (t) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
// mode: 'intro' | 'outro' | 'bg'
window.__render = (t, mode) => {
  if (mode === 'bg') { $('wrap').style.display = 'none'; return; }
  let a = clamp(t / 0.55), ti = clamp((t - 0.22) / 0.6), su = clamp((t - 0.4) / 0.6);
  let out = mode === 'intro' ? easeOut(clamp((t - 2.35) / 0.55)) : 0;
  $('icon').style.transform = `translateY(${-60 * out}px) scale(${0.82 + 0.18 * back(a)})`;
  $('icon').style.opacity = a * (1 - out);
  $('title').style.transform = `translateY(${40 * (1 - easeOut(ti)) - 60 * out}px)`;
  $('title').style.opacity = ti * (1 - out);
  $('sub').style.transform = `translateY(${40 * (1 - easeOut(su)) - 60 * out}px)`;
  $('sub').style.opacity = su * (1 - out);
  const cap = easeOut(clamp((t - 0.5) / 1.4));
  $('cap').style.transform = `scaleY(${0.05 + 0.95 * cap})`;
  $('cap').style.transformOrigin = '260px 104px';
  $('sunG').style.transform = `rotate(${t * 6}deg)`; $('sunG').style.transformOrigin = '440px 70px';
  flakes.forEach((f, i) => {
    const y = ((f.y0 + f.sp * t + 400) % 400) - 60, x = f.x + Math.sin(t * 1.4 + f.ph) * 10;
    const el = $('f' + i); el.setAttribute('cx', x); el.setAttribute('cy', y);
    el.setAttribute('opacity', (y > 80 && y < 230 && x > 60 && x < 460 ? 0 : 0.9) * a);
  });
};
window.__ready = true;
</script>
</body></html>
